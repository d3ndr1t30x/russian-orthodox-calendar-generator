[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "russian-orthodox-calendar"
version = "1.4.0"
description = "Offline-first Russian Orthodox printable calendar for Australia"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.8,<7", "reportlab>=4.2,<5", "Pillow>=11,<12",
  "requests>=2.32,<3", "beautifulsoup4>=4.12,<5", "lxml>=5,<7",
  "holidays>=0.60,<1", "pypdf>=5,<7"
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "pyinstaller>=6.10,<7"]

[project.scripts]
orthodox-calendar = "orthodox_calendar.app:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["orthodox_calendar*"]
